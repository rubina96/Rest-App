services:

  order-service:
    image: order-service:latest
    container_name: order-service
    ports:
      - "8080:8080"
    environment:      
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      - redis

 

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"